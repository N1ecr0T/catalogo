<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Online</title>
    <!-- FontAwesome para los íconos de la barra superior y redes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --border-color: #e5e5ea;
            --accent-color: #007aff;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-top: 105px;
            padding-bottom: 30px;
        }

        /* BARRA SUPERIOR FIJA (HEADER) */
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            height: 52px;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-logo {
            height: 28px;
            object-fit: contain;
        }

        .brand-text {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.3px;
        }

        /* NAVEGACIÓN HORIZONTAL DE CATEGORÍAS */
        .nav-categories {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            padding: 0 12px;
            height: 48px;
            align-items: center;
            scrollbar-width: none;
        }

        .nav-categories::-webkit-scrollbar {
            display: none;
        }

        .cat-tab {
            padding: 12px 14px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
        }

        .cat-tab.active {
            color: var(--text-main);
            border-bottom-color: var(--text-main);
        }

        /* BARRA DE HERRAMIENTAS (CATEGORÍA ACTUAL + FILTRO) */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .current-cat-pill {
            background: #e8e8ed;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sort-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        /* LISTA DE PRODUCTOS (ESTILO KYTE) */
        .products-list {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 14px;
            align-items: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.03);
        }

        .product-img {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #f0f0f2;
            flex-shrink: 0;
        }

        .product-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
            min-width: 0;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-tag {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-main);
        }

        /* MENÚ LATERAL DESPLEGABLE */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .drawer-menu {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #ffffff;
            z-index: 201;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .drawer-overlay.active + .drawer-menu,
        .drawer-menu.active {
            transform: translateX(280px);
        }

        .drawer-header {
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            border-bottom: 1px solid var(--border-color);
        }

        .drawer-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .drawer-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .drawer-links a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .contact-info h3 {
            font-size: 1rem;
            font-weight: 700;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
        }

        /* BUSCADOR FLOTANTE EN CABECERA */
        .search-bar-container {
            display: none;
            padding: 8px 16px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }

        .search-bar-container.active {
            display: block;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- CABECERA FIJA SUPERIOR -->
    <header class="fixed-header">
        <div class="header-top">
            <div class="header-left">
                <button class="icon-btn" id="openMenuBtn"><i class="fa-solid fa-bars"></i></button>
                <button class="icon-btn" id="toggleSearchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="header-brand">
                <span class="brand-text">TEXTO</span>
            </div>
            <div class="header-right">
                <button class="icon-btn"><i class="fa-solid fa-bag-shopping"></i></button>
            </div>
        </div>

        <!-- INPUT DE BÚSQUEDA (SE ACTIVA AL PRESIONAR LA LUPA) -->
        <div class="search-bar-container" id="searchBar">
            <input type="text" class="search-input" placeholder="Buscar productos...">
        </div>

        <!-- BARRA HORIZONTAL DE CATEGORÍAS -->
        <nav class="nav-categories">
            <div class="cat-tab active">ALL</div>
            <div class="cat-tab">TEXTO</div>
            <div class="cat-tab">TEXTO</div>
            <div class="cat-tab">TEXTO</div>
            <div class="cat-tab">TEXTO</div>
            <div class="cat-tab">TEXTO</div>
        </nav>
    </header>

    <!-- BARRA DE HERRAMIENTAS (CATEGORÍA SELECCIONADA + BOTÓN ORDENAR) -->
    <section class="toolbar">
        <span class="current-cat-pill">ALL</span>
        <button class="sort-btn">
            SORT BY <i class="fa-solid fa-sliders"></i>
        </button>
    </section>

    <!-- LISTA DE PRODUCTOS -->
    <main class="products-list">

        <!-- PRODUCTO 1 -->
        <article class="product-item">
            <img src="https://via.placeholder.com/150" alt="Producto" class="product-img">
            <div class="product-details">
                <h2 class="product-title">TEXTO</h2>
                <span class="product-tag">TEXTO</span>
                <span class="product-price">TEXTO</span>
            </div>
        </article>

        <!-- PRODUCTO 2 -->
        <article class="product-item">
            <img src="https://via.placeholder.com/150" alt="Producto" class="product-img">
            <div class="product-details">
                <h2 class="product-title">TEXTO</h2>
                <span class="product-tag">TEXTO</span>
                <span class="product-price">TEXTO</span>
            </div>
        </article>

        <!-- PRODUCTO 3 -->
        <article class="product-item">
            <img src="https://via.placeholder.com/150" alt="Producto" class="product-img">
            <div class="product-details">
                <h2 class="product-title">TEXTO</h2>
                <span class="product-tag">TEXTO</span>
                <span class="product-price">TEXTO</span>
            </div>
        </article>

        <!-- PRODUCTO 4 -->
        <article class="product-item">
            <img src="https://via.placeholder.com/150" alt="Producto" class="product-img">
            <div class="product-details">
                <h2 class="product-title">TEXTO</h2>
                <span class="product-tag">TEXTO</span>
                <span class="product-price">TEXTO</span>
            </div>
        </article>

        <!-- PRODUCTO 5 -->
        <article class="product-item">
            <img src="https://via.placeholder.com/150" alt="Producto" class="product-img">
            <div class="product-details">
                <h2 class="product-title">TEXTO</h2>
                <span class="product-tag">TEXTO</span>
                <span class="product-price">TEXTO</span>
            </div>
        </article>

    </main>

    <!-- MENÚ LATERAL DESPLEGABLE -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <aside class="drawer-menu" id="drawerMenu">
        <div class="drawer-header">
            <button class="icon-btn" id="closeMenuBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="drawer-content">
            <ul class="drawer-links">
                <li><a href="#">LOGIN OR CREATE ACCOUNT</a></li>
                <li><a href="#">MY ACCOUNT</a></li>
                <li><a href="#">MY ORDERS</a></li>
            </ul>

            <div class="contact-info">
                <h3>TEXTO</h3>
                <a href="#" class="contact-item">
                    <i class="fa-brands fa-whatsapp"></i> TEXTO
                </a>
                <a href="#" class="contact-item">
                    <i class="fa-brands fa-instagram"></i> TEXTO
                </a>
            </div>
        </div>
    </aside>

    <!-- SCRIPT PARA INTERACTIVIDAD -->
    <script>
        const openMenuBtn = document.getElementById('openMenuBtn');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const drawerMenu = document.getElementById('drawerMenu');
        const drawerOverlay = document.getElementById('drawerOverlay');
        const toggleSearchBtn = document.getElementById('toggleSearchBtn');
        const searchBar = document.getElementById('searchBar');

        // Abrir y cerrar menú lateral
        openMenuBtn.addEventListener('click', () => {
            drawerMenu.classList.add('active');
            drawerOverlay.classList.add('active');
        });

        const closeDrawer = () => {
            drawerMenu.classList.remove('active');
            drawerOverlay.classList.remove('active');
        };

        closeMenuBtn.addEventListener('click', closeDrawer);
        drawerOverlay.addEventListener('click', closeDrawer);

        // Mostrar / Ocultar barra de búsqueda
        toggleSearchBtn.addEventListener('click', () => {
            searchBar.classList.toggle('active');
        });
    </script>
</body>
</html>
