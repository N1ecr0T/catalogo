<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Online</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --primary-color: #000000;
            --border-color: #e9ecef;
            --accent-color: #25d366;
            --radius: 12px;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 40px;
        }

        /* HEADER & HERO */
        .hero-banner {
            width: 100%;
            height: 140px;
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            position: relative;
        }

        .header-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 16px;
            position: relative;
            top: -50px;
        }

        .profile-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid var(--card-bg);
            margin-top: -65px;
            object-fit: cover;
            background: #eee;
        }

        .profile-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-top: 8px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 20px;
            background: #f1f3f5;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .social-btn:hover {
            background: #e9ecef;
        }

        /* CONTENEDOR PRINCIPAL */
        .container {
            max-width: 800px;
            margin: -30px auto 0;
            padding: 0 16px;
        }

        /* BARRA DE BÚSQUEDA Y FILTROS */
        .controls-panel {
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--primary-color);
        }

        .filters-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .select-filter {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            font-size: 0.85rem;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            flex: 1;
            min-width: 130px;
        }

        /* CATEGORÍAS */
        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 12px;
            scrollbar-width: none;
        }

        .category-chip {
            padding: 8px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .category-chip.active {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        /* GRILLA DE PRODUCTOS */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        /* VISTA LISTA */
        .products-grid.list-view {
            grid-template-columns: 1fr;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .products-grid.list-view .product-card {
            flex-direction: row;
            height: 120px;
        }

        .product-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #eee;
        }

        .products-grid.list-view .product-img {
            width: 120px;
            height: 100%;
        }

        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .product-category {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-name {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 4px 0;
            color: var(--text-main);
        }

        .product-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* FOOTER */
        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- BANNER DE ENCABEZADO -->
    <div class="hero-banner"></div>

    <!-- TARJETA DE PERFIL DE LA TIENDA -->
    <div class="header-container">
        <div class="profile-card">

        <!-- LISTA DE CATEGORÍAS -->
        <div class="categories-scroll">

            <div class="category-chip">TEXTO</div>
            <div class="category-chip">TEXTO</div>

            <div class="category-chip">TEXTO</div>
        </div>

        <!-- GRILLA DE PRODUCTOS -->
        <section class="products-grid">

            <!-- PRODUCTO 1 -->
            <article class="product-card">

                <div class="product-info">
                    <div>

                        <h2 class="product-name">TEXTO</h2>
                        <p class="product-desc">TEXTO</p>
                    </div>
                    <div class="product-price">TEXTO</div>
                </div>
            </article>

            <!-- PRODUCTO 2 -->
            <article class="product-card">
                <img src="https://via.placeholder.com/300" alt="Producto" class="product-img">
                <div class="product-info">
                    <div>
                        <span class="product-category">TEXTO</span>
                        <h2 class="product-name">TEXTO</h2>
                        <p class="product-desc">TEXTO</p>
                    </div>
                    <div class="product-price">TEXTO</div>
                </div>
            </article>

            <!-- PRODUCTO 3 -->
            <article class="product-card">
                <img src="https://via.placeholder.com/300" alt="Producto" class="product-img">
                <div class="product-info">
                    <div>
                        <span class="product-category">TEXTO</span>
                        <h2 class="product-name">TEXTO</h2>
                        <p class="product-desc">TEXTO</p>
                    </div>
                    <div class="product-price">TEXTO</div>
                </div>
            </article>

            <!-- PRODUCTO 4 -->
            <article class="product-card">
                <img src="https://via.placeholder.com/300" alt="Producto" class="product-img">
                <div class="product-info">
                    <div>
                        <span class="product-category">TEXTO</span>
                        <h2 class="product-name">TEXTO</h2>
                        <p class="product-desc">TEXTO</p>
                    </div>
                    <div class="product-price">TEXTO</div>
                </div>
            </article>

        </section>

        <!-- PIE DE PÁGINA -->
        <footer class="footer">
            <p>TEXTO</p>
        </footer>

    </main>

</body>
</html>
